name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check tag matches version
        run: |
          v=$(python3 -c "import sys; sys.path.insert(0,'.'); import ai_ecosystem; print(ai_ecosystem.__version__)")
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != version v$v"; exit 1; }
      - run: ./scripts/sync-cloud-skills.sh && ./tests/test_install.sh
      - run: pipx run build && npm pack
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* ai-ecosystem-*.tgz --generate-notes
      # Optional publishing (add secrets PYPI_API_TOKEN / NPM_TOKEN to enable):
      - if: ${{ env.PYPI_API_TOKEN != '' }}
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: pipx run twine upload -u __token__ -p "$PYPI_API_TOKEN" dist/*
      - if: ${{ env.NPM_TOKEN != '' }}
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" > ~/.npmrc && npm publish ai-ecosystem-*.tgz
